{# Image upload widget – fragment included in document form; styles match appPFE pages #}
<style>
    .widget-clearable-image .current-image {
        background: #f8f9ff;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
    }
    .widget-clearable-image .current-image p {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 15px;
    }
    .widget-clearable-image .current-image img {
        max-width: 300px;
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .widget-clearable-image .clear-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: #333;
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 10px;
    }
    .widget-clearable-image .clear-label input {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #667eea;
    }
    .widget-clearable-image .change-label {
        font-weight: 600;
        color: #333;
        font-size: 15px;
        margin-bottom: 8px;
    }
    .widget-clearable-image input[type="file"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: white;
    }
</style>

<div class="widget-clearable-image">
{% if widget.image_url %}
    <div class="current-image">
        <p>Current image</p>
        <img src="{{ widget.image_url }}" alt="Current image">
    </div>
{% endif %}

{% if widget.is_initial %}
    {% if not widget.required %}
    <label class="clear-label" for="{{ widget.checkbox_id }}">
        <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}>
        {{ widget.clear_checkbox_label }}
    </label>
    {% endif %}
    <p class="change-label">{{ widget.input_text }}:</p>
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
</div>
